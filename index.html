<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Baustela 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D gradilište preko celog ekrana kao radna površina; plutajuća traka gore, alatna šina levo, stakleni panel desno. Na telefonu: model gore, panel ispod. */
:root{
  --bg:#E4E9EC;
  --glass:rgba(250,251,252,.82);
  --glass-strong:rgba(255,255,255,.94);
  --surface:#FFFFFF;
  --surface-2:#F1F4F6;
  --ink:#10171C;
  --ink-2:#56626B;
  --ink-3:#8A959D;
  --line:rgba(16,23,28,.10);
  --line-2:rgba(16,23,28,.18);
  --accent:#F25C05;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(242,92,5,.12);
  --ok:#2B8A3E; --ok-soft:rgba(43,138,62,.12);
  --warn:#B7791F; --warn-soft:rgba(240,159,0,.16);
  --bad:#D9302C; --bad-soft:rgba(217,48,44,.12);
  --info:#1C6FD1; --info-soft:rgba(28,111,209,.12);
  --shadow:0 10px 30px -8px rgba(16,23,28,.22), 0 2px 6px rgba(16,23,28,.08);
  --f-display:"Sora","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1215; --glass:rgba(22,28,33,.80); --glass-strong:rgba(26,33,38,.95); --surface:#1A2126; --surface-2:#222B31;
    --ink:#EAF0F3; --ink-2:#A7B3BB; --ink-3:#717E87; --line:rgba(234,240,243,.09); --line-2:rgba(234,240,243,.18);
    --accent:#FF7A2E; --accent-ink:#1B0D04; --accent-soft:rgba(255,122,46,.16);
    --ok:#6BD48A; --ok-soft:rgba(107,212,138,.14); --warn:#F5C451; --warn-soft:rgba(245,196,81,.15);
    --bad:#FF7B76; --bad-soft:rgba(255,123,118,.15); --info:#6FB4FF; --info-soft:rgba(111,180,255,.15);
    --shadow:0 12px 34px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1215; --glass:rgba(22,28,33,.80); --glass-strong:rgba(26,33,38,.95); --surface:#1A2126; --surface-2:#222B31;
  --ink:#EAF0F3; --ink-2:#A7B3BB; --ink-3:#717E87; --line:rgba(234,240,243,.09); --line-2:rgba(234,240,243,.18);
  --accent:#FF7A2E; --accent-ink:#1B0D04; --accent-soft:rgba(255,122,46,.16);
  --ok:#6BD48A; --ok-soft:rgba(107,212,138,.14); --warn:#F5C451; --warn-soft:rgba(245,196,81,.15);
  --bad:#FF7B76; --bad-soft:rgba(255,123,118,.15); --info:#6FB4FF; --info-soft:rgba(111,180,255,.15);
  --shadow:0 12px 34px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100%;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}

/* viewport */
.viewport{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.viewport canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.viewport[data-mode="pregled"] canvas{cursor:zoom-in}
.viewport[data-mode="lasso"] canvas,.viewport[data-mode="krug"] canvas{cursor:cell}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.viewport.drawing .labels *{pointer-events:none!important}

/* gornja traka */
.topbar{position:absolute;z-index:5;top:22px;left:calc(max(16px,env(safe-area-inset-left,0px)) + 12px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 12px);display:flex;align-items:center;gap:10px;pointer-events:none;flex-wrap:wrap}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo svg{width:18px;height:18px;stroke-width:2.2}
.brand .nm{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .nm b{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.01em}
.brand .nm input{border:0;background:transparent;font-size:12px;color:var(--ink-2);padding:0;width:210px;max-width:44vw;border-radius:4px}
.brand .nm input:focus{outline:1px solid var(--accent);outline-offset:2px;color:var(--ink)}
.datenav{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.datenav button{border:0;background:transparent;height:30px;min-width:30px;padding:0 10px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.datenav button:hover{background:var(--surface-2)}
.datenav .dn{font-family:var(--f-display);font-weight:600;font-size:13px;padding:0 6px;min-width:84px;text-align:center}
.datenav input{border:0;background:transparent;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding:0 4px;height:30px}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:8px 12px;border-radius:999px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.pill-btn{border:0;height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}

/* alatna šina */
.rail{position:absolute;z-index:4;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.rail .grp{display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:16px}
.tool{position:relative;width:40px;height:40px;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;color:var(--ink-2);font-family:var(--f-display);font-weight:600;font-size:12px}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool.acc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[data-tip]:hover::after,.tool[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-family:var(--f-body);font-weight:600;font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:9}
.tool kbd{position:absolute;right:3px;bottom:2px;font-family:var(--f-mono);font-size:8px;opacity:.55}
.rail .cap{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-top:3px}

/* status i legenda */
.status{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12.5px;max-width:calc(100% - 24px);white-space:nowrap}
.status .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.status span:last-child{overflow:hidden;text-overflow:ellipsis}
.legend{position:absolute;z-index:3;left:66px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:36%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.av{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;font-family:var(--f-display);flex:none;letter-spacing:-.02em}

/* 3D natpisi */
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;padding:3px 10px 3px 3px;border-radius:999px;background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;white-space:nowrap;max-width:210px}
.lbl .t{overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;line-height:1.15;text-align:left}
.lbl .t small{font-weight:500;color:var(--ink-2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.lbl.blok{box-shadow:0 0 0 2px var(--bad),var(--shadow)}
.lbl.done{opacity:.6}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:var(--glass-strong);transform:translateX(-50%) rotate(45deg);border-radius:1px}
.mlbl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;padding:5px 11px;border-radius:8px;background:var(--mc);color:#fff;font-size:12px;font-weight:700;box-shadow:0 6px 18px -4px var(--mc);display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:240px}
.mlbl span{overflow:hidden;text-overflow:ellipsis}
.mlbl.done{opacity:.55;text-decoration:line-through}

/* panel */
.panel{position:absolute;z-index:5;top:80px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 12px);bottom:22px;width:410px;border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease,opacity .25s ease}
.app.collapsed .panel{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.tabs{display:flex;gap:2px;padding:6px;margin:8px 8px 0;border-radius:12px;background:var(--surface-2);flex:none;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:7px 9px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{font-family:var(--f-mono);font-size:10px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.pane{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
h2{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .l{font-size:11.5px;color:var(--ink-2)}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;background:var(--warn-soft)}
.alert .d{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--warn)}
.alert.bad{background:var(--bad-soft)}.alert.bad .d{background:var(--bad)}
.alert.info{background:var(--info-soft)}.alert.info .d{background:var(--info)}
.alert.okk{background:var(--ok-soft)}.alert.okk .d{background:var(--ok)}
.zone{display:flex;flex-direction:column;gap:5px}
.zh{font-size:11px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.zh .hgt{color:var(--warn);font-weight:600}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.row:hover{border-color:var(--line-2)}
.row .av{width:28px;height:28px;font-size:10.5px}
.who{font-weight:700;font-size:13px}
.what{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;align-items:center}
.st{border:0;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.st.plan{background:var(--info-soft);color:var(--info)}
.st.rad{background:var(--warn-soft);color:var(--warn)}
.st.gotovo{background:var(--ok-soft);color:var(--ok)}
.st.blok{background:var(--bad-soft);color:var(--bad)}
.ib{border:0;background:transparent;border-radius:8px;width:28px;height:28px;display:inline-grid;place-items:center;color:var(--ink-3)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:16px;height:16px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--ink-2)}
.mk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 9px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.mk .sw{width:28px;height:28px;border-radius:8px;background:var(--mc);display:grid;place-items:center;color:#fff}
.mk .sw svg{width:15px;height:15px}
.mk.done{opacity:.6}

.wk{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.wk .l1{display:flex;gap:8px;align-items:center}
.wk .l1 .av{width:34px;height:34px;font-size:12px;border:0;cursor:pointer}
.wk .l1 input.nm{flex:1;min-width:0;font-family:var(--f-display);font-size:16px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 6px}
.wk .l1 input.nm:hover{border-color:var(--line-2)}
.wk .l1 input.nm:focus{border-color:var(--accent);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .fl{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 9px;min-width:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{resize:vertical;min-height:64px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.att .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;min-width:0}
.att .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 7px;width:100%;font-family:var(--f-mono);font-size:12px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 8px;font-size:11px;font-weight:700;border-radius:7px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--f-mono);font-weight:500;font-size:10px;text-transform:uppercase;color:var(--ink-3)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
pre.report{font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;background:var(--surface);padding:14px;border-radius:var(--r-sm);margin:0;line-height:1.55;border:1px solid var(--line)}
.research{display:flex;flex-direction:column;gap:12px}
.fact{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px}
.fact .num{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-.02em}
.gap{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r-sm) var(--r-sm) 0}
.gap b{font-size:13px}
.gap .fix{font-size:12px;color:var(--ok);font-weight:600}
.research ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.research a{color:var(--info)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,12,14,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--glass-strong);border-radius:18px;border:1px solid var(--line);width:min(500px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98)}to{transform:none}}
.zhead{display:flex;flex-direction:column;gap:4px}
.zhead .k{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:3px 11px 3px 3px;font-size:12px;font-weight:700;background:var(--surface)}
.pick[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.pick .busy{font-weight:500;color:var(--ink-3);font-size:11px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.type{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:12px;font-weight:700}
.type i{width:14px;height:14px;border-radius:4px;background:var(--mc)}
.type[aria-pressed="true"]{border-color:var(--mc);box-shadow:0 0 0 2px var(--mc) inset}
.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.local{font-size:12px;background:var(--warn-soft);border-radius:var(--r-sm);padding:8px 11px}

@media (max-width:900px){
  .app{height:auto;min-height:100%;gap:10px}
  .topbar{position:static;order:0}
  .viewport{flex:none;height:64vh;min-height:360px;order:1}
  .panel{position:static;width:auto;order:2;min-height:50vh}
  .app.collapsed .panel{transform:none;opacity:1;pointer-events:auto}
  #togglePanel{display:none}
  .legend{display:none}
  .pane{overflow:visible}
  .rail{top:auto;bottom:56px;transform:none}
  .rail .views{display:none}
  .tool[data-tip]:hover::after{display:none}
}
@media (min-width:901px){ .app:not(.collapsed) .status{left:calc(50% - 205px)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
/* ---------- konstante ---------- */
const H = 3.2, FLOORS = 4;
const TRADES = ["Zidanje","Armiranje","Oplata","Betoniranje","Elektroinstalacije","Vodovod i kanalizacija","Fasada","Montaža skele","Krovni radovi","Izolacija","Malterisanje","Iskop i zemljani radovi","Transport materijala","Čišćenje","Ostalo"];
const STATUS = {plan:"Planirano", rad:"U toku", gotovo:"Završeno", blok:"Zastoj"};
const STATUS_ORDER = ["plan","rad","gotovo","blok"];
const BLOCKS = ["Čeka materijal","Čeka mehanizaciju","Vremenski uslovi","Nejasan crtež / projekat","Čeka drugu ekipu","Kvar alata","Nadzor nije odobrio","Ostalo"];
const ATT = {p:"Prisutan", o:"Odsutan", b:"Bolovanje", g:"Godišnji"};
const COLORS = ["#E8590C","#1971C2","#2F9E44","#AE3EC9","#F08C00","#0C8599","#C2255C","#5C940D","#6741D9","#868E96","#D6336C","#1098AD"];
const DAYS = ["Nedelja","Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota"];
const WEATHER = ["Sunčano","Oblačno","Kiša","Jak vetar","Sneg","Magla","Mraz"];
const MTYPES = {
  opasnost:{l:"Opasnost", c:"#E03131"},
  paznja:{l:"Pažnja", c:"#F08C00"},
  zadatak:{l:"Zadatak", c:"#1C7ED6"},
  kvalitet:{l:"Kontrola kvaliteta", c:"#9C36B5"},
  info:{l:"Informacija", c:"#0CA678"}
};
const ICON = {
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  focus:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  mark:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 2.6"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>'
};

/* ---------- pomoćne ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoLocal = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoLocal(d); };
const diffDays = (a,b) => Math.round((parseD(a)-parseD(b))/86400000);
const fmtD = s => { if(!s) return "—"; const d = parseD(s); return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+"."; };
const rsd = n => Math.round(n).toLocaleString("sr-RS")+" RSD";
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o || {}));
const initials = n => { const s = String(n || "?").trim(); const m = /(\d+)\s*$/.exec(s); if(/^RADNIK/i.test(s) && m) return "R" + m[1]; return s.split(/\s+/).slice(0,2).map(x => x[0] || "").join("").toUpperCase(); };
const TODAY = isoLocal(new Date());
const floorName = f => f===0 ? "Prizemlje" : f===3 ? "3. sprat (u izgradnji)" : f+". sprat";

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Kopirano"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Kopirano"); }catch(_){ toast("Označi tekst i kopiraj ručno"); } ta.remove(); }
}

/* ---------- skladište ---------- */
const S = { workers:new Map(), assignments:new Map(), days:new Map(), meta:new Map(), marks:new Map() };
let db = null, mode = "init";
const LS = "baustela3d-v1";
function persistLocal(){ if(mode !== "local") return; try { const o = {}; for(const k of Object.keys(S)) o[k] = Object.fromEntries(S[k]); localStorage.setItem(LS, JSON.stringify(o)); } catch(e){} }
function loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LS) || "null"); if(o) for(const k of Object.keys(S)) S[k] = new Map(Object.entries(o[k] || {})); } catch(e){} }
async function put(col, id, data){
  if(mode === "db"){ try { await db.collection(col).doc(id).set(data); } catch(e){ toast("Čuvanje nije uspelo (" + (e && e.code || "greška") + "). Pokušaj ponovo."); } }
  else { S[col].set(id, data); persistLocal(); renderAll(); }
}
async function del(col, id){
  if(mode === "db"){ try { await db.collection(col).doc(id).delete(); } catch(e){ toast("Brisanje nije uspelo. Pokušaj ponovo."); } }
  else { S[col].delete(id); persistLocal(); renderAll(); }
}
async function initStore(){
  let ns = null;
  try { if(window.claude && typeof window.claude.use === "function") ns = await window.claude.use("db"); } catch(e){ ns = null; }
  if(ns){
    db = ns; mode = "db"; $("#sync").textContent = "Sačuvano u oblaku"; $("#sync").classList.add("on");
    for(const col of Object.keys(S)){
      db.collection(col).onSnapshot(snap => { S[col] = new Map(snap.docs.map(d => [d.id, d.data()])); renderAll(); },
        () => toast("Veza sa bazom je prekinuta. Osveži stranicu."));
    }
  } else { mode = "local"; loadLocal(); $("#sync").textContent = "Lokalno"; renderAll(); }
}

/* ---------- stanje prikaza ---------- */
let cur = TODAY, tab = "dan", floorMax = FLOORS - 1, tool = "dodeli";
try { const t = localStorage.getItem("baustela-tab"); if(t) tab = t; } catch(e){}

/* ---------- izvedeni podaci ---------- */
const workers = () => [...S.workers.entries()].map(([id,w]) => ({id, ...w})).sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || String(a.name).localeCompare(String(b.name), "sr"));
const dayAssign = date => [...S.assignments.entries()].map(([id,a]) => ({id, ...a})).filter(a => a.date === date);
const dayMarks = date => [...S.marks.entries()].map(([id,m]) => ({id, ...m})).filter(m => m.always ? m.date <= date : m.date === date);
const dayDoc = date => S.days.get(date) || {};
const attOf = (date, wid) => { const d = dayDoc(date); return (d.att && d.att[wid]) || null; };
const wName = wid => { const w = S.workers.get(wid); return w ? w.name : "Obrisan radnik"; };
const wColor = wid => { const w = S.workers.get(wid); return w ? w.color : "#868E96"; };
const isHeight = a => (a.floor ?? 0) >= 1 || /Skela|kran|Krov/i.test(a.zone || "");
const avatar = (wid, cls) => `<span class="av ${cls||""}" style="--c:${wColor(wid)}">${esc(initials(wName(wid)))}</span>`;
function certState(dateStr, ref){ if(!dateStr) return "none"; const d = diffDays(dateStr, ref); return d < 0 ? "bad" : d <= 30 ? "warn" : "ok"; }

function computeAlerts(date){
  const out = [], ws = workers(), as = dayAssign(date);
  const byW = new Map(); as.forEach(a => { if(!byW.has(a.workerId)) byW.set(a.workerId, []); byW.get(a.workerId).push(a); });
  for(const w of ws){
    const att = attOf(date, w.id), list = byW.get(w.id) || [];
    const planned = list.reduce((s,a) => s + (+a.hours || 0), 0);
    if(att && att.s === "p" && !list.length) out.push({lvl:"warn", t:`${w.name} je prisutan, a nema zaduženje. Plaćeni sati bez rasporeda.`});
    if(att && att.s !== "p" && list.length) out.push({lvl:"bad", t:`${w.name} ima zaduženje, a vodi se kao „${ATT[att.s]}”. Prerasporedi posao.`});
    if(planned > 10) out.push({lvl:"warn", t:`${w.name}: planirano ${planned} h u jednom danu.`});
    if(att && att.s === "p" && planned > 0 && (+att.h || 0) > planned + 1) out.push({lvl:"info", t:`${w.name}: prisutan ${att.h} h, raspoređeno ${planned} h.`});
    const znr = certState(w.znr, date), lek = certState(w.lek, date);
    if(list.length){
      if(znr === "bad" || znr === "none") out.push({lvl:"bad", t:`${w.name}: ${znr==="none"?"nije uneta":"istekla"} obuka za bezbedan rad, a raspoređen je.`});
      if(list.some(isHeight) && (lek === "bad" || lek === "none")) out.push({lvl:"bad", t:`${w.name} radi na visini bez važećeg lekarskog pregleda.`});
    }
    if(znr === "warn") out.push({lvl:"info", t:`${w.name}: obuka za bezbedan rad ističe ${fmtD(w.znr)}.`});
    if(lek === "warn") out.push({lvl:"info", t:`${w.name}: lekarski pregled ističe ${fmtD(w.lek)}.`});
  }
  as.filter(a => a.status === "blok").forEach(a => out.push({lvl:"bad", t:`Zastoj · ${a.zone}: ${a.block || "razlog nije naveden"} (${wName(a.workerId)}).`}));
  dayMarks(date).filter(m => m.type === "opasnost" && !m.done).forEach(m => out.push({lvl:"bad", t:`Označena opasna zona: ${m.title}.`}));
  const order = {bad:0, warn:1, info:2};
  return out.sort((a,b) => order[a.lvl] - order[b.lvl]);
}

/* ================= 3D ================= */
const stage = $("#stage");
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.2, 800);
const HOME = {pos:[38, 24, 40], tgt:[0, 5, 0]};
camera.position.set(...HOME.pos);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(...HOME.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 2.5; controls.maxDistance = 170;
controls.screenSpacePanning = true; controls.rotateSpeed = 0.7; controls.panSpeed = 0.9;

const ANISO = renderer.capabilities.getMaxAnisotropy();
function canvasTex(size, draw){
  const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d"); draw(g, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = ANISO; return t;
}
function speckle(g, s, n, colors, maxR){
  for(let i=0;i<n;i++){ g.fillStyle = colors[(Math.random()*colors.length)|0]; g.globalAlpha = Math.random()*0.5+0.1; const r = Math.random()*maxR+0.5; g.fillRect(Math.random()*s, Math.random()*s, r, r); }
  g.globalAlpha = 1;
}
const TEX = {
  concrete: canvasTex(256, (g,s) => { g.fillStyle = "#B4B1AA"; g.fillRect(0,0,s,s); speckle(g,s,5000,["#9C9992","#C9C6BF","#8E8B84","#D2CFC9"],2);
    g.fillStyle = "rgba(60,58,54,.35)"; for(let x=32;x<s;x+=64) for(let y=32;y<s;y+=64){ g.beginPath(); g.arc(x,y,2,0,7); g.fill(); }
    g.strokeStyle = "rgba(80,78,72,.18)"; g.lineWidth = 1; g.strokeRect(0.5,0.5,s-1,s-1); }),
  fresh: canvasTex(256, (g,s) => { g.fillStyle = "#CFCBC3"; g.fillRect(0,0,s,s); speckle(g,s,4000,["#BDB9B0","#DEDAD2","#B0ACA3"],2); }),
  brick: canvasTex(256, (g,s) => { g.fillStyle = "#CFC6B8"; g.fillRect(0,0,s,s); const bh = s/8, bw = s/4;
    for(let r=0;r<8;r++) for(let c=-1;c<5;c++){ const off = r%2 ? bw/2 : 0; const h = 18+Math.random()*10, l = 36+Math.random()*10;
      g.fillStyle = `hsl(${h},${52+Math.random()*12}%,${l}%)`; g.fillRect(c*bw+off+2, r*bh+2, bw-4, bh-4); }
    speckle(g,s,1600,["#7A3A24","#C98B6B","#5E2C1C"],1.5); }),
  ply: canvasTex(256, (g,s) => { g.fillStyle = "#C99A5E"; g.fillRect(0,0,s,s); g.strokeStyle = "rgba(120,80,40,.35)";
    for(let i=0;i<40;i++){ g.lineWidth = Math.random()*2+0.5; g.beginPath(); const y = Math.random()*s; g.moveTo(0,y); for(let x=0;x<=s;x+=16) g.lineTo(x, y + Math.sin(x/30+i)*4); g.stroke(); }
    g.strokeStyle = "rgba(70,45,20,.5)"; g.lineWidth = 2; g.strokeRect(1,1,s-2,s-2); }),
  ground: canvasTex(512, (g,s) => { g.fillStyle = "#8E7F66"; g.fillRect(0,0,s,s);
    for(let i=0;i<60;i++){ const x=Math.random()*s,y=Math.random()*s,r=20+Math.random()*60; const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0, Math.random()>.5?"rgba(110,96,74,.45)":"rgba(160,145,118,.35)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(x-r,y-r,2*r,2*r); }
    speckle(g,s,9000,["#6E6250","#A8987C","#5B5143","#B7A98E"],2.5); }),
  gravel: canvasTex(256, (g,s) => { g.fillStyle = "#8D8981"; g.fillRect(0,0,s,s); speckle(g,s,9000,["#6F6B64","#A8A39A","#5D5A54","#C0BCB3"],3); }),
  asphalt: canvasTex(256, (g,s) => { g.fillStyle = "#3C3F42"; g.fillRect(0,0,s,s); speckle(g,s,7000,["#2E3134","#55595D","#47494C"],2); })
};
function worldUV(geom, tile){
  const p = geom.attributes.position, n = geom.attributes.normal, uv = geom.attributes.uv;

    const nx = Math.abs(n.getX(i)), ny = Math.abs(n.getY(i)), nz = Math.abs(n.getZ(i));

const previewMat = new THREE.LineBasicMaterial({color:0xF25C05, depthTest:false, transparent:true});

function setPreview(pts, closed){
  const arr = []; pts.forEach(p => arr.push(p.x, p.y, p.z)); if(closed && pts.length) arr.push(pts[0].x, pts[0].y, pts[0].z);

function circlePts(c, n, r, count){
  const a = Math.abs(n.y) < 0.9 ? UP.clone() : new THREE.Vector3(1,0,0);
  const u = new THREE.Vector3().crossVectors(n, a).normalize(), v = new THREE.Vector3().crossVectors(n, u).normalize(), out = [];
  for(let i=0;i<count;i++){ const t = i / count * Math.PI * 2; out.push(c.clone().addScaledVector(u, Math.cos(t)*r).addScaledVector(v, Math.sin(t)*r).addScaledVector(n, 0.05)); }
  return out;
}
function simplify(pts, max){ if(pts.length <= max) return pts; const out = [], step = pts.length / max; for(let i=0;i<max;i++) out.push(pts[Math.floor(i*step)]); return out; }

let downAt = null, clickTimer = null;
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => {
  downAt = {x:e.clientX, y:e.clientY};
  if((tool === "lasso" || tool === "krug") && e.button === 0){
    const h = siteHit(e); if(!h) return;
    const n = h.face ? h.face.normal.clone().transformDirection(h.object.matrixWorld) : UP.clone();
    controls.enabled = false; stage.classList.add("drawing"); cv.setPointerCapture(e.pointerId);
    draw = {kind:tool, pts:[h.point.clone().addScaledVector(n, 0.06)], c:h.point.clone(), n, r:0, obj:h.object};
    reticle.visible = false;
  }
});
cv.addEventListener("pointermove", e => {
  if(draw){
    if(draw.kind === "lasso"){
      const h = siteHit(e); if(!h) return;
      const n = h.face ? h.face.normal.clone().transformDirection(h.object.matrixWorld) : UP.clone();
      const p = h.point.clone().addScaledVector(n, 0.06);
      if(p.distanceTo(draw.pts[draw.pts.length-1]) > 0.18){ draw.pts.push(p); setPreview(draw.pts, false); }
    } else {
      setRay(e); const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(draw.n, draw.c), q = new THREE.Vector3();
      if(ray.ray.intersectPlane(plane, q)){ draw.r = Math.min(25, q.distanceTo(draw.c)); draw.pts = circlePts(draw.c, draw.n, draw.r, 56); setPreview(draw.pts, true); setStatus("Krug", `Prečnik ${(draw.r*2).toFixed(1)} m · pusti da završiš`); }
    }
    return;
  }
  if(e.buttons) return;
  hover(e);
});
function endDraw(e){
  if(!draw) return;
  const d = draw; draw = null; controls.enabled = true; stage.classList.remove("drawing"); setPreview([], false);
  try { cv.releasePointerCapture(e.pointerId); } catch(_){}
  setTool(tool);
  let pts = d.pts;
  if(d.kind === "krug" && d.r < 0.35){ toast("Krug je premali. Povuci dalje od centra."); return; }
  if(d.kind === "lasso" && pts.length < 6){ toast("Povuci duže da zaokružiš deo modela."); return; }
  pts = simplify(pts, 90).map(p => [+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)]);
  const c = centroid(pts), z = zoneFromHit(d.obj, new THREE.Vector3(...c));

}
cv.addEventListener("pointerup", e => {
  if(draw){ endDraw(e); return; }
  if(!downAt) return; const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y); downAt = null;
  if(moved > 6 || e.button !== 0) return;
  const mh = hit(e, markerGroup.children); if(mh && mh.object.userData.aid){ openAssign({edit:mh.object.userData.aid}); return; }
  const kh = hit(e, markGroup.children); if(kh && kh.object.userData.mid && tool !== "lasso" && tool !== "krug"){ openMark({edit:kh.object.userData.mid}); return; }
  const h = siteHit(e); if(!h) return;
  if(tool === "pregled"){ zoomToPoint(h.point); return; }
  if(tool === "dodeli"){
    clearTimeout(clickTimer);
    const z = zoneFromHit(h.object, h.point), pt = {x:h.point.x, y:h.point.y, z:h.point.z};

});

cv.addEventListener("dblclick", e => { clearTimeout(clickTimer); const h = siteHit(e); if(h) zoomToPoint(h.point); });
let hoverPending = false;
function hover(e){

  requestAnimationFrame(() => {
    hoverPending = false;
    const mh = hit(e, markerGroup.children);
    if(mh && mh.object.userData.aid){ const a = S.assignments.get(mh.object.userData.aid); reticle.visible = false; if(a) setStatus("Radnik", `${wName(a.workerId)} · ${a.task} · klikni za izmenu`); return; }

}

/* zum ka kursoru */
function zoomAround(p, factor){
  const off = camera.position.clone().sub(p), len = off.length();
  const nl = THREE.MathUtils.clamp(len * factor, 1.6, controls.maxDistance), k = nl / len;
  camera.position.copy(p).add(off.multiplyScalar(k));
  controls.target.sub(p).multiplyScalar(k).add(p);
}
stage.addEventListener("wheel", e => {
  if(e.target !== cv) return;
  e.preventDefault(); e.stopPropagation();
  const h = siteHit(e); let p;
  if(h) p = h.point; else { setRay(e); p = ray.ray.at(camera.position.distanceTo(controls.target), new THREE.Vector3()); }
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAround(p, Math.exp(THREE.MathUtils.clamp(d, -120, 120) * 0.0022));
}, {capture:true, passive:false});
function flyTo(pos, target, dur){
  const p0 = camera.position.clone(), t0 = controls.target.clone(), p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...target);
  const D = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : (dur || 700), s = performance.now();
  (function step(now){ const k = Math.min(1, (now - s) / D), e = 1 - Math.pow(1-k, 3); camera.position.lerpVectors(p0, p1, e); controls.target.lerpVectors(t0, t1, e); if(k < 1) requestAnimationFrame(step); })(s);
}
function zoomToPoint(p){
  const dir = camera.position.clone().sub(controls.target).normalize(), dist = Math.max(4, camera.position.distanceTo(controls.target) * 0.4);
  const np = p.clone().addScaledVector(dir, dist); flyTo([np.x, Math.max(np.y, p.y + 1.2), np.z], [p.x, p.y, p.z]);
}
const zoomBtn = f => { const t = controls.target.clone(); const p0 = camera.position.clone(); zoomAround(t, f); const p1 = camera.position.clone(); camera.position.copy(p0); flyTo([p1.x,p1.y,p1.z], [t.x,t.y,t.z], 260); };
$("#zIn").onclick = () => zoomBtn(0.6); $("#zOut").onclick = () => zoomBtn(1.6);

}

  if((m.floor ?? 0) > floorMax) setFloor(m.floor); flyTo([c[0] + r*1.6 + 4, c[1] + r*1.4 + 4, c[2] + r*1.8 + 5], c); }

function resize(){

function modal(html, onMount){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal" id="mdl" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#mdl").addEventListener("pointerdown", e => { if(e.target.id === "mdl") close(); });
  onMount(close, root);
  const f = root.querySelector("[autofocus]"); if(f) f.focus();
}
function workerPicks(sel, editing, ignoreAid){

  return workers().map(w => { const att = attOf(cur, w.id), off = att && att.s !== "p", b = busy.get(w.id) || 0;
    return `<button class="pick" style="--c:${w.color}" data-w="${w.id}" aria-pressed="${sel.has(w.id)}"><span class="av" style="--c:${w.color}">${esc(initials(w.name))}</span>${esc(w.name)}<span class="busy">${off ? ATT[att.s] : b ? b + " h" : "slobodan"}</span></button>`; }).join("");

function reportText(){
  const ws = workers(), as = dayAssign(cur), d = dayDoc(cur), proj = (S.meta.get("project") || {}).name || "Gradilište", mk = dayMarks(cur);
  const present = ws.filter(w => (attOf(cur, w.id) || {}).s === "p"), absent = ws.filter(w => { const a = attOf(cur, w.id); return a && a.s !== "p"; });
  const hrs = present.reduce((s,w) => s + (+attOf(cur, w.id).h || 0), 0), L = [];
  L.push("DNEVNI IZVEŠTAJ SA GRADILIŠTA", proj, `${DAYS[parseD(cur).getDay()]}, ${fmtD(cur)}`, `Vreme: ${d.weather || "—"}${d.temp !== undefined && d.temp !== "" ? `, ${d.temp} °C` : ""}`, "");
  L.push("RADNA SNAGA", `Prisutno: ${present.length} od ${ws.length} radnika, ukupno ${hrs} h`);
  if(absent.length) L.push(`Odsutni: ${absent.map(w => `${w.name} (${ATT[attOf(cur, w.id).s].toLowerCase()})`).join(", ")}`);
  L.push("", "IZVEDENI RADOVI PO LOKACIJI");
  const groups = new Map(); as.forEach(a => { if(!groups.has(a.zone)) groups.set(a.zone, []); groups.get(a.zone).push(a); });
  if(!as.length) L.push("— nema unetih zaduženja");
  groups.forEach((list, z) => { L.push(`• ${z}`); list.forEach(a => L.push(`   - ${a.task}${a.desc ? ": " + a.desc : ""} · ${wName(a.workerId)} · ${a.hours} h · ${STATUS[a.status]}`)); });
  const bl = as.filter(a => a.status === "blok");
  L.push("", "ZASTOJI", bl.length ? bl.map(a => `• ${a.zone}: ${a.block || "razlog nije naveden"} (${wName(a.workerId)})`).join("\n") : "— nema");
  if(mk.length){ L.push("", "NAGLAŠENE ZONE"); mk.forEach(m => L.push(`• [${(MTYPES[m.type] || MTYPES.paznja).l}] ${m.title}${m.done ? " (rešeno)" : ""}${m.note ? " — " + m.note : ""}`)); }
  if(d.note) L.push("", "NAPOMENA", d.note);
  L.push("", "Sastavio: ________________    Nadzor: ________________");
  return L.join("\n");
}

    <p class="small muted">Sastavlja se sam iz zaduženja, prisustva i naglašenih zona. Dopuni vreme i napomenu.</p>
    <div class="grid2">
      <div class="fld"><label for="wth">Vremenski uslovi</label><select id="wth"><option value="">—</option>${WEATHER.map(w => `<option ${w===d.weather?"selected":""}>${w}</option>`).join("")}</select></div>
      <div class="fld"><label for="tmp">Temperatura (°C)</label><input id="tmp" type="number" step="1" value="${esc(d.temp ?? "")}"></div>
    </div>
    <div class="fld"><label for="dnote">Napomena (posete, isporuke, nalozi nadzora)</label><textarea id="dnote" maxlength="1500">${esc(d.note || "")}</textarea></div>
    <pre class="report">${esc(reportText())}</pre>`;
  $("#wth").onchange = e => saveDay({weather:e.target.value}); $("#tmp").onchange = e => saveDay({temp:e.target.value}); $("#dnote").onchange = e => saveDay({note:e.target.value});
  $("#copyR").onclick = () => copyText(reportText());
}

/* ================= ZAGLAVLJE ================= */
function renderHeader(){
  $("#dDate").value = cur;
  const dd = diffDays(cur, TODAY);
  $("#dName").textContent = dd === 0 ? "Danas" : dd === -1 ? "Juče" : dd === 1 ? "Sutra" : DAYS[parseD(cur).getDay()];
  const p = S.meta.get("project"), inp = $("#projName"); if(document.activeElement !== inp) inp.value = (p && p.name) || "Moje gradilište";
  const n = computeAlerts(cur).filter(a => a.lvl === "bad").length, b = $("#alertBadge"); b.hidden = !n; b.textContent = n;
}
const setDate = d => { if(!d) return; cur = d; renderAll(); };
$("#dPrev").onclick = () => setDate(addDays(cur, -1)); $("#dNext").onclick = () => setDate(addDays(cur, 1));
$("#dToday").onclick = () => setDate(TODAY); $("#dDate").onchange = e => setDate(e.target.value);
$("#projName").addEventListener("change", e => put("meta", "project", {name: e.target.value.trim() || "Moje gradilište"}));

function renderAll(){
  renderHeader(); rebuildMarkers(); rebuildMarks(); renderLegend();
  const a = document.activeElement;
  if(a && $("#pane").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  renderPane();
}
buildFloorGrp(); setTool("dodeli"); setTab(tab); renderAll(); initStore();
})();
